global:
  scrape_interval: 5s
scrape_configs:
  - job_name: backend
    static_configs:
      - targets: ['localhost:8001', 'localhost:8002', 'localhost:8003', 'localhost:8080']
  - job_name: kafka
    static_configs:
      - targets: ['localhost:9308']
  - job_name: livekit
    static_configs:
      - targets: ['localhost:6789']
