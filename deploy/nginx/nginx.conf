# Единая точка входа (06-deployment.md): SPA и REST API на одном origin – так работает cookie vks_refresh
# (SameSite=Strict, Path=/api/v1/auth). /webhooks, /internal, /health и /ready наружу не проксируются.
upstream auth_service {
    server auth-service:8001;
}

upstream meeting_service {
    server meeting-service:8002;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    client_max_body_size 1m;
    server_tokens off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Сквозной идентификатор запроса: сервисы пишут его в журнал и возвращают в ошибках (request_id).
    proxy_set_header X-Request-ID $request_id;
    add_header X-Request-ID $request_id always;

    # auth-service: вход, токены, профиль, администрирование учетных записей.
    location /api/v1/auth/ { proxy_pass http://auth_service; }
    location /api/v1/users/ { proxy_pass http://auth_service; }
    location /api/v1/admin/users { proxy_pass http://auth_service; }

    # meeting-service: встречи, вход, участники, настройки.
    location /api/v1/meetings { proxy_pass http://meeting_service; }
    location /api/v1/join/ { proxy_pass http://meeting_service; }
    location /api/v1/participants/ { proxy_pass http://meeting_service; }
    location /api/v1/settings { proxy_pass http://meeting_service; }
    location /api/v1/admin/meetings { proxy_pass http://meeting_service; }
    location /api/v1/admin/health { proxy_pass http://meeting_service; }

    # Неизвестный путь API – 404, а не index.html SPA.
    location /api/ { return 404; }

    location / {
        # Маршруты SPA (/meetings, /j/<код>) отдает index.html; сам index.html не кешируется.
        try_files $uri /index.html;
        location = /index.html { add_header Cache-Control "no-cache"; }
        location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    }
}
