# Дополнение к docker-compose.dev.yml, Linux; все интерфейсы мониторинга доступны только локально.
services:
  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: [monitoring]
    network_mode: host
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.listen-address=127.0.0.1:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  grafana:
    image: grafana/grafana:11.6.0
    profiles: [monitoring]
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana:/etc/grafana/provisioning:ro
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    profiles: [monitoring]
    network_mode: host
    command: ["--kafka.server=localhost:9092", "--web.listen-address=127.0.0.1:9308"]
