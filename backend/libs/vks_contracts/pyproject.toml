[project]
name = "vks-contracts"
version = "0.1.0"
description = "Контракты событий Kafka ReactiVKS: конверт, payload, топики – один источник правды производителя и потребителя"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Только pydantic: контракты не тянут за собой ни шасси, ни фреймворк, ни клиента Kafka.
    "pydantic==2.13.5",
]

[project.scripts]
vks-contracts-schema = "vks_contracts.schema:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vks_contracts"]
