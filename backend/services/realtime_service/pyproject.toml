[project]
name = "realtime-service"
version = "0.1.0"
description = "ReactiVKS realtime-service: панель эмоций организатора"
requires-python = ">=3.12,<3.13"
dependencies = [
    "vks-common",
    "uvicorn[standard]==0.52.4",
    "redis==5.2.1",
]

[tool.uv.sources]
vks-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/realtime_service"]
