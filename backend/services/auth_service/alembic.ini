# Миграции схемы auth. Адрес БД – из DATABASE_URL (или DATABASE_URL_FILE), роль auth_svc – владелец схемы.
#   DATABASE_URL=postgresql+asyncpg://auth_svc:…@localhost:5432/vks uv run alembic -c services/auth_service/alembic.ini upgrade head
[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
