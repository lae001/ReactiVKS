[project]
name = "auth-service"
version = "0.1.0"
description = "ReactiVKS auth-service: учетные записи, вход, JWT RS256 и JWKS"
requires-python = ">=3.12,<3.13"
dependencies = ["vks-common"]

[tool.uv.sources]
vks-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auth_service"]
