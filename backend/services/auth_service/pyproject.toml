[project]
name = "auth-service"
version = "0.1.0"
description = "ReactiVKS auth-service: учетные записи, вход, JWT RS256 и JWKS"
requires-python = ">=3.12,<3.13"
dependencies = [
    "vks-common",
    # Argon2id – эталонная реализация победителя Password Hashing Competition.
    "argon2-cffi==25.1.0",
    # Подпись access-токенов RS256; extra crypto читает PEM и считает отпечаток ключа (kid).
    "pyjwt[crypto]==2.13.0",
    "uvicorn[standard]==0.52.4",
]

[tool.uv.sources]
vks-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auth_service"]
