# Миграции схемы analytics. Адрес БД – из DATABASE_URL (или DATABASE_URL_FILE), роль analytics_svc – владелец схемы.
#   DATABASE_URL=postgresql+asyncpg://analytics_svc:…@localhost:5432/vks uv run alembic -c services/analytics_service/alembic.ini upgrade head
[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
