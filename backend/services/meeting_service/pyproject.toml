[project]
name = "meeting-service"
version = "0.1.0"
description = "ReactiVKS meeting-service: встречи, участники, согласия, интеграция с LiveKit"
requires-python = ">=3.12,<3.13"
dependencies = [
    "vks-common",
    "uvicorn[standard]==0.52.4",
    # Server API LiveKit (CreateRoom, DeleteRoom) и подпись токенов доступа участников.
    "livekit-api==1.2.1",
    # HTTP-клиент livekit-api: таймауты и ошибки сети адаптер задает и ловит сам.
    "aiohttp==3.14.5",
]

[tool.uv.sources]
vks-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_service"]
