# Миграции схемы meeting. Адрес БД – из DATABASE_URL (или DATABASE_URL_FILE), роль meeting_svc – владелец схемы.
#   DATABASE_URL=postgresql+asyncpg://meeting_svc:…@localhost:5432/vks uv run alembic -c services/meeting_service/alembic.ini upgrade head
[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
