[project]
name = "fer-training"
version = "0.1.0"
description = "ReactiVKS: обучение, оценка и экспорт модели распознавания эмоций (docs/ml/ml-model.md)"
requires-python = ">=3.12,<3.13"
dependencies = [
    # CUDA 12.8 – минимальная сборка с поддержкой Blackwell (RTX 50xx); на CPU работает та же сборка.
    "torch>=2.7",
    "torchvision>=0.22",
    "timm>=1.0",
    "albumentations>=2.0",
    "opencv-python-headless>=4.10",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "huggingface-hub>=0.26",
    "tqdm>=4.66",
    # Общий препроцессинг лица (emotion_service.preprocessing) – тот же код, что в сервисе.
    "emotion-service",
]

[project.scripts]
fer-train = "fer_training.cli:main"

[dependency-groups]
dev = [
    "ruff==0.16.5",
    "pytest==9.1.1",
    # EDA-ноутбук и сравнение детекторов лиц (EMO-44): нужны только исследованию, не обучению.
    "jupyter>=1.1",
    "nbconvert>=7.16",
    "mediapipe>=0.10.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fer_training"]

[tool.uv.sources]
emotion-service = { path = "../emotion_service", editable = true }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "DTZ", "T20"]
# N812: torch.nn.functional as F – общепринятое имя.
ignore = ["N812"]

[tool.ruff.lint.per-file-ignores]
# CLI и скрипты пишут в консоль – это их назначение; тесты используют assert.
"src/fer_training/cli.py" = ["T201"]
"scripts/**" = ["T201", "S603", "S607"]
"tests/**" = ["S101"]
"notebooks/**" = ["T201", "E402"]

[tool.pytest.ini_options]
addopts = "--strict-markers --import-mode=importlib"
testpaths = ["tests"]
